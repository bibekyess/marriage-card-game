# Marriage card game: app + Postgres. Configure via .env (see .env.example).
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-marriage}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-marriage}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    # DB port intentionally not published; app reaches it at db:5432.

  app:
    build: .
    init: true
    stop_grace_period: 15s
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-marriage}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-marriage}
      PORT: "3000"
      TRUST_PROXY: ${TRUST_PROXY:-}
    # Localhost only: a reverse proxy on the host (e.g. Caddy) serves it publicly, and
    # nobody can bypass the proxy to forge X-Forwarded-For when TRUST_PROXY is on.
    ports:
      - "127.0.0.1:${APP_PORT:-9062}:3000"

volumes:
  pgdata:
